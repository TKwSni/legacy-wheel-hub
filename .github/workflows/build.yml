name: Compilar y Empaquetar Legacy Wheel Hub

on:
  push:
    branches: ["add-g25-support"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      # ============================================================
      # COMPILAR PROXY dinput8.dll PARA JUEGOS DE 64 BITS
      # ============================================================
      - name: Configurar MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparar carpeta del proxy x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\proxy\x64" | Out-Null

      - name: Compilar dinput8.dll x64
        shell: cmd
        working-directory: dinput8-proxy\src
        run: |
          cl.exe /nologo /O2 /LD /EHsc /std:c++17 /MD dllmain.cpp ^
            /link /DEF:dinput8.def user32.lib advapi32.lib dinput8.lib dxguid.lib ^
            /OUT:..\..\assets\proxy\x64\dinput8.dll

      # ============================================================
      # COMPILAR PROXY dinput8.dll PARA JUEGOS DE 32 BITS
      # ============================================================
      - name: Configurar MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Preparar carpeta del proxy x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\proxy\x86" | Out-Null

      - name: Compilar dinput8.dll x86
        shell: cmd
        working-directory: dinput8-proxy\src
        run: |
          cl.exe /nologo /O2 /LD /EHsc /std:c++17 /MD dllmain.cpp ^
            /link /DEF:dinput8.def user32.lib advapi32.lib dinput8.lib dxguid.lib ^
            /OUT:..\..\assets\proxy\x86\dinput8.dll

      - name: Verificar DLLs nativas
        shell: pwsh
        run: |
          if (!(Test-Path "assets\proxy\x64\dinput8.dll")) {
            throw "No se generó assets\proxy\x64\dinput8.dll"
          }

          if (!(Test-Path "assets\proxy\x86\dinput8.dll")) {
            throw "No se generó assets\proxy\x86\dinput8.dll"
          }

          Write-Host "Proxy x64:"
          Get-Item "assets\proxy\x64\dinput8.dll" | Format-List FullName,Length

          Write-Host "Proxy x86:"
          Get-Item "assets\proxy\x86\dinput8.dll" | Format-List FullName,Length

      # ============================================================
      # PYTHON / DEPENDENCIAS
      # ============================================================
      - name: Instalar Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Actualizar pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install `
            pyinstaller `
            PySide6 `
            PySide6-Fluent-Widgets `
            PySideSix-Frameless-Window `
            pywin32 `
            hidapi

      # ============================================================
      # VALIDAR IMPORTS ANTES DE EMPAQUETAR
      # ============================================================
      - name: Validar imports y sintaxis Python
        shell: pwsh
        run: |
          python -m py_compile LegacyWheelHub.py

          python -c "import PySide6; print('PySide6:', PySide6.__version__)"
          python -c "import qfluentwidgets; print('qfluentwidgets: OK')"
          python -c "import qframelesswindow; print('qframelesswindow: OK')"
          python -c "import hid; print('hid: OK')"

      # ============================================================
      # VALIDAR ARCHIVOS DEL PROYECTO
      # ============================================================
      - name: Verificar archivos necesarios
        shell: pwsh
        run: |
          $required = @(
            "LegacyWheelHub.py",
            "wheel.ico",
            "wheel.png",
            "assets\proxy\x64\dinput8.dll",
            "assets\proxy\x86\dinput8.dll"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Falta el archivo requerido: $file"
            }
            Write-Host "OK: $file"
          }

      # ============================================================
      # PYINSTALLER
      # ============================================================
      - name: Generar ejecutable con PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name LegacyWheelHub `
            --icon wheel.ico `
            --collect-all qfluentwidgets `
            --collect-all qframelesswindow `
            --collect-all PySide6 `
            --add-data "wheel.png;." `
            --add-data "assets;assets" `
            LegacyWheelHub.py

      # ============================================================
      # VALIDAR BUILD
      # ============================================================
      - name: Verificar paquete generado
        shell: pwsh
        run: |
          $exe = "dist\LegacyWheelHub\LegacyWheelHub.exe"

          if (!(Test-Path $exe)) {
            throw "Falta en el paquete final: $exe"
          }
          Write-Host "OK: $exe"

          # PyInstaller 6 (onedir) normalmente coloca --add-data
          # dentro de _internal. Aceptamos ambas estructuras:
          #   dist\LegacyWheelHub\assets\...
          #   dist\LegacyWheelHub\_internal\assets\...
          $proxyCandidates = @(
            "dist\LegacyWheelHub\assets\proxy",
            "dist\LegacyWheelHub\_internal\assets\proxy"
          )

          $proxyDir = $null
          foreach ($candidate in $proxyCandidates) {
            if ((Test-Path "$candidate\x64\dinput8.dll") -and
                (Test-Path "$candidate\x86\dinput8.dll")) {
              $proxyDir = $candidate
              break
            }
          }

          if ($null -eq $proxyDir) {
            throw "No se encontraron los proxies x64/x86 en assets ni en _internal\assets"
          }

          Write-Host "OK: proxies encontrados en $proxyDir"
          Write-Host "OK: $proxyDir\x64\dinput8.dll"
          Write-Host "OK: $proxyDir\x86\dinput8.dll"

          # PyInstaller 6 también puede colocar wheel.png en _internal.
          $wheelCandidates = @(
            "dist\LegacyWheelHub\wheel.png",
            "dist\LegacyWheelHub\_internal\wheel.png"
          )

          $wheelFound = $null
          foreach ($candidate in $wheelCandidates) {
            if (Test-Path $candidate) {
              $wheelFound = $candidate
              break
            }
          }

          if ($null -eq $wheelFound) {
            throw "No se encontró wheel.png ni en el directorio del EXE ni en _internal"
          }

          Write-Host "OK: $wheelFound"

          Write-Host ""
          Write-Host "Contenido del paquete:"
          Get-ChildItem "dist\LegacyWheelHub" -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # CREAR ZIP
      # ============================================================
      - name: Crear ZIP de distribución
        shell: pwsh
        run: |
          if (Test-Path "dist\LegacyWheelHub-G25-Release.zip") {
            Remove-Item "dist\LegacyWheelHub-G25-Release.zip" -Force
          }

          Compress-Archive `
            -Path "dist\LegacyWheelHub\*" `
            -DestinationPath "dist\LegacyWheelHub-G25-Release.zip" `
            -CompressionLevel Optimal

          Get-Item "dist\LegacyWheelHub-G25-Release.zip" |
            Format-List FullName, Length

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Subir paquete completo como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyWheelHub-G25-Release
          path: dist/LegacyWheelHub-G25-Release.zip
          if-no-files-found: error
          retention-days: 14
