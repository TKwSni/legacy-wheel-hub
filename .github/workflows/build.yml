name: Compilar dinput8-proxy

on:
  push:
    branches: [ "add-g25-support" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4

    - name: Configurar entorno MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compilar dinput8.dll
      shell: cmd
      run: |
        cd dinput8-proxy/src
        cl.exe /O2 /LD /EHsc /std:c++17 dllmain.cpp /link /DEF:dinput8.def /OUT:dinput8.dll

    - name: Subir artefacto compilado
      uses: actions/upload-artifact@v4
      with:
        name: dinput8-dll
        path: dinput8-proxy/src/dinput8.dll
